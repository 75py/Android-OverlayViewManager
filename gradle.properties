org.gradle.jvmargs=-Xmx2048m
org.gradle.daemon=true
org.gradle.parallel=true
#org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true

android.nonFinalResIds=false

# AGP 9.0+ defaults android.newDsl to true, which is incompatible with the
# org.jetbrains.kotlin.android plugin. Since this change keeps that plugin applied
# explicitly (see android.builtInKotlin below) instead of migrating to built-in
# Kotlin/the new DSL interfaces, opt out of both for now. Revisit before AGP 10,
# where both flags are removed and their new behavior becomes mandatory (see PR body).
android.newDsl=false

# AGP 9.2 enables built-in Kotlin support (replacing the org.jetbrains.kotlin.android
# plugin) by default. Opt out for now so this toolchain bump keeps applying the Kotlin
# Android plugin explicitly instead of also migrating kotlinOptions {} to the new
# kotlin { compilerOptions {} } DSL in the same change. Revisit before AGP 10, where
# built-in Kotlin becomes mandatory (see PR body).
android.builtInKotlin=false
